name: Feature request
description: Suggest a new check or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Monitoring requirement
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: input
    id: version
    attributes:
      label: OPNsense version
