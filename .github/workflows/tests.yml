name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile plugin
        run: python -m py_compile check_opnsense.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate and reproduce Director basket
        run: |
          cp director/check_opnsense-basket.json /tmp/check_opnsense-basket.json
          python tools/build_director_basket.py
          diff -u /tmp/check_opnsense-basket.json director/check_opnsense-basket.json
          python -m json.tool director/check_opnsense-basket.json >/dev/null
